openapi: 3.0.3
info:
  title: Tasks API
  version: 1.0.0
  description: >
    OpenAPI 3.0.3 specification for the Tasks Management Service.
    Course: Service-Oriented Architecture (INT3505E) - Group 4 (UET).
  contact:
    name: Group 4
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:5000
    description: Mock server (Prism)
  - url: http://localhost:8080/api/v1
    description: Local development server
tags:
  - name: Tasks
    description: Operations related to task management
security:
  - bearerAuth: []

paths:
  /tasks:
    get:
      tags:
        - Tasks
      summary: Get task list
      description: Retrieve a list of tasks with pagination and status filter.
      operationId: listTasks
      parameters:
        - name: limit
          in: query
          description: Number of tasks to return per page.
          required: false
          schema:
            type: integer
            default: 10
            example: 10
        - name: status
          in: query
          description: Filter tasks by status (open, done).
          required: false
          schema:
            type: string
            enum:
              - open
              - done
            example: open
      responses:
        '200':
          description: Successfully retrieved task list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Tasks
      summary: Create a new task
      description: Create a new task with given details.
      operationId: createTask
      requestBody:
        description: Task creation payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
      responses:
        '201':
          description: Task created successfully.
          headers:
            Location:
              description: URI of the newly created task.
              schema:
                type: string
                example: /tasks/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks/{taskId}:
    get:
      tags:
        - Tasks
      summary: Get task details by ID
      description: Retrieve detailed information of a specific task by its ID.
      operationId: getTaskById
      parameters:
        - name: taskId
          in: path
          description: Numeric ID of the task.
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Successfully retrieved task details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Tasks
      summary: Update a task partially
      description: Update one or more fields of an existing task.
      operationId: patchTask
      parameters:
        - name: taskId
          in: path
          description: Numeric ID of the task.
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        description: Fields to update for the task.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInput'
      responses:
        '200':
          description: Task updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Tasks
      summary: Delete a task
      description: Remove a task by its ID.
      operationId: deleteTask
      parameters:
        - name: taskId
          in: path
          description: Numeric ID of the task.
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Task deleted successfully. No content returned.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT Bearer token.

  schemas:
    Task:
      type: object
      description: Full task object.
      required:
        - id
        - title
        - status
        - priority
        - dueDate
        - assigneeId
      properties:
        id:
          type: integer
          description: Unique identifier of the task.
          example: 1
        title:
          type: string
          description: Title of the task.
          example: Complete SOA assignment
        status:
          type: string
          description: Current status of the task.
          enum:
            - open
            - done
          example: open
        priority:
          type: string
          description: Priority level of the task.
          enum:
            - low
            - normal
            - high
          example: normal
        dueDate:
          type: string
          format: date-time
          description: Due date in RFC 3339 / ISO 8601 format.
          example: '2026-10-25T17:00:00Z'
        assigneeId:
          type: integer
          description: ID of the user assigned to this task.
          example: 101

    CreateTaskInput:
      type: object
      description: Request payload for creating a task.
      required:
        - title
        - dueDate
        - assigneeId
      properties:
        title:
          type: string
          description: Title of the task.
          example: Complete SOA assignment
        status:
          type: string
          description: Initial task status. Defaults to open.
          enum:
            - open
            - done
          default: open
          example: open
        priority:
          type: string
          description: Task priority level. Defaults to normal.
          enum:
            - low
            - normal
            - high
          default: normal
          example: normal
        dueDate:
          type: string
          format: date-time
          description: Due date in RFC 3339 / ISO 8601 format.
          example: '2026-10-25T17:00:00Z'
        assigneeId:
          type: integer
          description: ID of the assignee.
          example: 101

    UpdateTaskInput:
      type: object
      description: Request payload for partially updating a task.
      properties:
        title:
          type: string
          description: New title of the task.
          example: Submit SOA final assignment
        status:
          type: string
          description: Updated status of the task.
          enum:
            - open
            - done
          example: done
        priority:
          type: string
          description: Updated priority level.
          enum:
            - low
            - normal
            - high
          example: high
        dueDate:
          type: string
          format: date-time
          description: Updated due date in RFC 3339 / ISO 8601 format.
          example: '2026-10-30T23:59:59Z'
        assigneeId:
          type: integer
          description: Updated assignee ID.
          example: 102

    ErrorResponse:
      type: object
      description: Standard error response format.
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type or code.
          example: NOT_FOUND
        message:
          type: string
          description: Descriptive error message.
          example: Task not found with id 1

  responses:
    BadRequestError:
      description: Bad request due to invalid parameters or malformed body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: BAD_REQUEST
            message: Invalid request parameters.

    UnauthorizedError:
      description: Unauthorized request, missing or invalid JWT Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: UNAUTHORIZED
            message: Missing or invalid authentication token.

    NotFoundError:
      description: The requested task was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: NOT_FOUND
            message: Task not found with the specified id.

    ValidationError:
      description: Validation error in request body fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: VALIDATION_ERROR
            message: dueDate must be a valid RFC 3339 date-time format.

    InternalServerError:
      description: Unexpected internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: INTERNAL_SERVER_ERROR
            message: An unexpected error occurred on the server.
