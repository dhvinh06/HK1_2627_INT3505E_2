openapi: 3.0.3
info:
  title: Social Network API - Auth
  version: 1.0.0
  description: |
    Spec cho 3 endpoint: login, refresh, đọc bài viết.
    Access token (JWT, 15 phút) gửi qua Authorization: Bearer.
    Refresh token (30 ngày) chỉ dùng cho /auth/refresh.
servers:
  - url: https://api.example.com/v1

tags:
  - name: auth
  - name: posts

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Đăng nhập, nhận access + refresh token
      description: Endpoint public, không cần token và không cần scope.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: Thiếu hoặc sai định dạng email/password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sai email hoặc mật khẩu (thông báo chung, không nói cái nào sai)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quá nhiều lần thử đăng nhập (rate limit)
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Đổi refresh token lấy access token mới
      description: |
        Yêu cầu refresh token hợp lệ, chưa hết hạn, chưa bị thu hồi (kiểm jti).
        Không cần scope. Access token KHÔNG dùng được ở endpoint này.
      operationId: refreshToken
      security:
        - refreshAuth: []
      responses:
        '200':
          description: Cấp access token mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          description: Refresh token thiếu, sai chữ ký, hết hạn, đã thu hồi hoặc sai loại token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /posts/{id}:
    get:
      tags: [posts]
      summary: Lấy một bài viết theo id
      description: |
        Cần access token với scope `posts:read`.
        Kiểm tra quyền đối tượng (chống BOLA): bài private chỉ chủ bài
        hoặc người được chia sẻ mới xem được.
      operationId: getPost
      security:
        - bearerAuth: [posts:read]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Trả về bài viết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: id không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Thiếu token, token sai chữ ký, hết hạn hoặc đã thu hồi
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token hợp lệ nhưng thiếu scope posts:read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Bài viết không tồn tại, HOẶC bài private mà người gọi không có quyền
            (trả 404 thay vì 403 để không lộ sự tồn tại của bài)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token, sống 15 phút
    refreshAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Refresh token, sống 30 ngày, chỉ dùng cho /auth/refresh

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: an@vnu.edu.vn
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Thời hạn access token (giây)
          example: 900
    AccessToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
    Post:
      type: object
      required: [id, author_id, content, visibility, created_at]
      properties:
        id:
          type: integer
          format: int64
        author_id:
          type: integer
          format: int64
        content:
          type: string
        visibility:
          type: string
          enum: [public, friends, private]
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid_credentials
        message:
          type: string